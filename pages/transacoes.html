<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Transações | Sant'Anna Finance</title>
</head>

<body>

    <aside class="sidebar">
        <h1 class="logo">Sant'Anna Finance</h1>

        <nav>
            <ul>
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="">Pendências</a></li>
                <li><a href="./transacoes.html">Transações</a></li>
                <li><a href="">Pessoas</a></li>
                <li><a href="">Configurações</a></li>
            </ul>
        </nav>
    </aside>

    <main>

        <header class="header">
            <h2 class="titulo-header">Transações</h2>
            <p>Gerencie suas transações financeiras.</p>
        </header>

        <section class="nova-transacao">

            <h2>Nova transação</h2>

            <form id="form-transacao">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" name="descricao" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" name="valor" step="0.01" min="0" required>
                </div>

                <button type="submit">Adicionar transação</button>

            </form>

        </section>

        <section>
            <h2>Minhas transações</h2>

            <div class="cabecalho-transacoes">
                <span>Nome</span>
                <span>Descrição</span>
                <span>Valor</span>
                <span>Data</span>
                <span>Ação</span>
            </div>

            <div id="lista-transacoes">
                <!-- somente transações -->
                  
            </div>
        </section>

    </main>

    <script src="../js/script.js"></script>

</body>

</html>
